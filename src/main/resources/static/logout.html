<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>退出登录 - 学习平台</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
    .logout-page { height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f7; }
    /* 扁平：白卡片直接浮在灰底上，不要投影 */
    .logout-card { width: 360px; background: #fff; border-radius: 24px; padding: 44px 36px; text-align: center; box-shadow: none; }
    .logout-card .icon { font-size: 56px; margin-bottom: 16px; }
    .logout-card h1 { font-size: 22px; color: #1d1d1f; margin: 0 0 8px; font-weight: 600; }
    .logout-card p { color: #86868b; margin: 0 0 24px; font-size: 14px; }
    .el-button { border-radius: 12px !important; font-weight: 500; border: none !important; }
    .el-button:active { transform: scale(.97); }
  </style>
</head>
<body>
<div id="app">
  <div class="logout-page">
    <div class="logout-card">
      <div class="icon">👋</div>
      <h1>确认退出</h1>
      <p>当前用户：{{ username }}</p>
      <div style="display:flex; gap:12px; justify-content:center">
        <el-button type="primary" :loading="loading" @click="handleLogout">确认退出</el-button>
        <el-button @click="history.back()">取消</el-button>
      </div>
    </div>
  </div>
</div>
<script>
const { createApp, ref, onMounted } = Vue;
const app = createApp({
  setup() {
    const loading = ref(false);
    const username = ref('加载中...');
    const handleLogout = async () => {
      loading.value = true;
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
        localStorage.removeItem('user');
        location.href = '/login.html';
      } catch { loading.value = false; }
    };
    onMounted(async () => {
      try {
        const res = await fetch('/api/users/currentUser');
        if (res.ok) { const u = await res.json(); if (u?.username) { username.value = u.nickname || u.username; return; } }
      } catch {}
      const s = localStorage.getItem('user');
      username.value = s ? (JSON.parse(s).nickname || JSON.parse(s).username) : '未知用户';
    });
    return { loading, username, handleLogout };
  }
});
for (const [k, c] of Object.entries(ElementPlusIconsVue)) app.component(k, c);
app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
