<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>操作日志</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <script src="/common.js"></script>
</head>
<body>
<div id="app">
  <app-layout>
    <div class="toolbar"><h2>操作日志</h2></div>
    <div class="card">
      <el-table :data="logList" v-loading="loading" stripe style="width:100%">
        <el-table-column label="ID" width="70" align="center"><template #default="{ row }">{{ row.id }}</template></el-table-column>
        <el-table-column label="操作人" width="100"><template #default="{ row }">{{ row.username || '-' }}</template></el-table-column>
        <el-table-column label="操作" width="100"><template #default="{ row }">{{ row.operation || '-' }}</template></el-table-column>
        <el-table-column label="方法" min-width="200" show-overflow-tooltip><template #default="{ row }">{{ row.method || '-' }}</template></el-table-column>
        <el-table-column label="参数" min-width="200" show-overflow-tooltip><template #default="{ row }">{{ row.params || '-' }}</template></el-table-column>
        <el-table-column label="耗时(ms)" width="90" align="center"><template #default="{ row }">{{ row.timeMs ?? '-' }}</template></el-table-column>
        <el-table-column label="IP" width="120"><template #default="{ row }">{{ row.ip || '-' }}</template></el-table-column>
        <el-table-column label="时间" width="170"><template #default="{ row }">{{ fmt(row.createTime) }}</template></el-table-column>
      </el-table>
      <div class="pager">
        <el-pagination background layout="total, prev, pager, next" :total="total"
          v-model:current-page="query.page" v-model:page-size="query.size" @current-change="load" />
      </div>
    </div>
  </app-layout>
</div>
<script>
initApp({
  components: { AppLayout },
  setup() {
    const logList = ref([]);
    const loading = ref(false);
    const total = ref(0);
    const query = reactive({ page: 1, size: 20 });

    const fmt = (t) => t ? new Date(t).toLocaleString('zh-CN') : '-';

    const load = async () => {
      loading.value = true;
      try {
        const res = await api(`/api/logs?page=${query.page - 1}&size=${query.size}`);
        if (!res || !res.ok) return;
        const d = await res.json();
        logList.value = d.content;
        total.value = d.totalElements;
      } finally { loading.value = false; }
    };

    onMounted(() => load());
    return { logList, loading, total, query, fmt, load };
  }
});
</script>
</body>
</html>
