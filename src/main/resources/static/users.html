<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://unpkg.com/@element-plus/icons-vue"></script>
  <script src="/common.js"></script>
</head>
<body>
<div id="app">
  <app-layout>
    <div class="toolbar">
      <h2>用户管理</h2>
      <el-button v-if="hasPermission('user:add')" type="primary" @click="openCreate"><el-icon><Plus /></el-icon>&nbsp;新增</el-button>
    </div>
    <div class="card">
      <el-table :data="userList" v-loading="loading" stripe style="width:100%">
        <el-table-column label="ID" width="60" align="center"><template #default="{ row }">{{ row.id }}</template></el-table-column>
        <el-table-column label="用户名" min-width="100"><template #default="{ row }">{{ row.username }}</template></el-table-column>
        <el-table-column label="昵称" min-width="100"><template #default="{ row }">{{ row.nickname }}</template></el-table-column>
        <el-table-column label="邮箱" min-width="160" show-overflow-tooltip><template #default="{ row }">{{ row.email || '-' }}</template></el-table-column>
        <el-table-column label="手机号" min-width="110"><template #default="{ row }">{{ row.phone || '-' }}</template></el-table-column>
        <el-table-column label="状态" width="80" align="center">
          <template #default="{ row }"><el-tag :type="row.status ? 'success' : 'info'" size="small">{{ row.status ? '启用' : '禁用' }}</el-tag></template>
        </el-table-column>
        <el-table-column label="操作" width="240" align="center" fixed="right">
          <template #default="{ row }">
            <el-button v-if="hasPermission('role:perm')" link type="primary" @click="openRoleAssign(row)">分配角色</el-button>
            <el-button v-if="hasPermission('user:edit')" link type="primary" @click="openEdit(row)">编辑</el-button>
            <el-button v-if="hasPermission('user:edit')" link :type="row.status ? 'warning' : 'success'" @click="toggleStatus(row)">{{ row.status ? '禁用' : '启用' }}</el-button>
            <el-button v-if="hasPermission('user:delete')" link type="danger" @click="del(row)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>
      <div class="pager">
        <el-pagination background layout="total, prev, pager, next" :total="total"
          v-model:current-page="query.page" v-model:page-size="query.size" />
      </div>
    </div>

    <el-dialog v-model="dialogVisible" :title="editingId ? '编辑用户' : '新增用户'" width="480px" @closed="resetForm">
      <el-form ref="formRef" :model="form" :rules="rules" label-width="80px">
        <el-form-item label="用户名" prop="username"><el-input v-model="form.username" /></el-form-item>
        <el-form-item label="昵称"><el-input v-model="form.nickname" /></el-form-item>
        <el-form-item label="邮箱"><el-input v-model="form.email" /></el-form-item>
        <el-form-item label="手机号"><el-input v-model="form.phone" /></el-form-item>
        <el-form-item label="性别"><el-radio-group v-model="form.gender"><el-radio :label="true">男</el-radio><el-radio :label="false">女</el-radio></el-radio-group></el-form-item>
        <el-form-item label="年龄"><el-input-number v-model="form.age" :min="1" :max="120" /></el-form-item>
        <el-form-item label="密码" :prop="editingId ? '' : 'password'"><el-input v-model="form.password" type="password" show-password :placeholder="editingId ? '留空不修改' : '请输入密码'" /></el-form-item>
      </el-form>
      <template #footer><el-button @click="dialogVisible = false">取消</el-button><el-button type="primary" :loading="submitting" @click="submit">确定</el-button></template>
    </el-dialog>

    <el-dialog v-model="roleDialogVisible" :title="`分配角色 - ${roleAssignUser?.username || ''}`" width="420px">
      <el-checkbox-group v-model="assignedRoleIds">
        <div v-for="r in allRoles" :key="r.id" style="margin:8px 0;">
          <el-checkbox :label="r.id">{{ r.name }}（{{ r.code }}）</el-checkbox>
        </div>
      </el-checkbox-group>
      <template #footer><el-button @click="roleDialogVisible = false">取消</el-button><el-button type="primary" :loading="submitting" @click="submitRoles">确定</el-button></template>
    </el-dialog>
  </app-layout>
</div>
<script>
initApp({
  components: { AppLayout },
  setup() {
    const userList = ref([]);
    const loading = ref(false);
    const submitting = ref(false);
    const dialogVisible = ref(false);
    const editingId = ref(null);
    const total = ref(0);
    const query = reactive({ page: 1, size: 10 });
    const form = reactive({ username: '', nickname: '', email: '', phone: '', gender: true, age: null, password: '' });
    const formRef = ref(null);
    const rules = {
      username: [{ required: true, message: '请输入用户名', trigger: 'blur' }, { min: 3, max: 50, message: '3-50个字符', trigger: 'blur' }],
      password: [{ required: true, message: '请输入密码', trigger: 'blur' }, { min: 6, message: '至少6位', trigger: 'blur' }]
    };

    const roleDialogVisible = ref(false);
    const roleAssignUser = ref(null);
    const allRoles = ref([]);
    const assignedRoleIds = ref([]);

    const load = async () => {
      loading.value = true;
      try {
        const res = await api(`/api/users?page=${query.page - 1}&size=${query.size}`);
        if (!res || !res.ok) return;
        const d = await res.json();
        userList.value = d.content;
        total.value = d.totalElements;
      } finally { loading.value = false; }
    };

    const resetForm = () => {
      editingId.value = null;
      Object.assign(form, { username: '', nickname: '', email: '', phone: '', gender: true, age: null, password: '' });
      nextTick(() => formRef.value?.clearValidate());
    };

    const openCreate = () => { resetForm(); dialogVisible.value = true; };
    const openEdit = (row) => {
      resetForm();
      editingId.value = row.id;
      Object.assign(form, { username: row.username, nickname: row.nickname, email: row.email, phone: row.phone, gender: row.gender, age: row.age });
      dialogVisible.value = true;
    };

    const submit = () => {
      formRef.value.validate(async (valid) => {
        if (!valid) return;
        submitting.value = true;
        try {
          const body = { ...form };
          if (editingId.value && !form.password) delete body.password;
          const url = editingId.value ? `/api/users/${editingId.value}` : '/api/users';
          const method = editingId.value ? 'PUT' : 'POST';
          const res = await api(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          if (!res || !res.ok) throw new Error('保存失败');
          ElementPlus.ElMessage.success(editingId.value ? '修改成功' : '新增成功');
          dialogVisible.value = false;
          load();
        } catch (e) { ElementPlus.ElMessage.error(e.message); }
        finally { submitting.value = false; }
      });
    };

    const del = (row) => {
      ElementPlus.ElMessageBox.confirm(`确定删除用户「${row.username}」？`, '提示', { type: 'warning' })
        .then(async () => {
          const res = await api(`/api/users/${row.id}`, { method: 'DELETE' });
          if (res && res.ok) { ElementPlus.ElMessage.success('已删除'); load(); }
        }).catch(() => {});
    };

    const toggleStatus = async (row) => {
      const res = await api(`/api/users/${row.id}/${row.status ? 'disable' : 'enable'}`, { method: 'PATCH' });
      if (res && res.ok) { ElementPlus.ElMessage.success('操作成功'); load(); }
    };

    const openRoleAssign = async (row) => {
      roleAssignUser.value = row;
      if (allRoles.value.length === 0) {
        const res = await api('/api/roles');
        if (res && res.ok) allRoles.value = await res.json();
      }
      const res = await api(`/api/roles/user/${row.id}`);
      if (res && res.ok) assignedRoleIds.value = await res.json();
      roleDialogVisible.value = true;
    };

    const submitRoles = async () => {
      submitting.value = true;
      try {
        const res = await api(`/api/roles/user/${roleAssignUser.value.id}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ roleIds: assignedRoleIds.value })
        });
        if (!res || !res.ok) throw new Error('分配失败');
        ElementPlus.ElMessage.success('角色分配成功');
        roleDialogVisible.value = false;
      } catch (e) { ElementPlus.ElMessage.error(e.message); }
      finally { submitting.value = false; }
    };

    onMounted(() => load());

    return { userList, loading, submitting, dialogVisible, editingId, total, query, form, formRef, rules, roleDialogVisible, roleAssignUser, allRoles, assignedRoleIds, load, resetForm, openCreate, openEdit, submit, del, toggleStatus, openRoleAssign, submitRoles, hasPermission };
  }
});
</script>
</body>
</html>
